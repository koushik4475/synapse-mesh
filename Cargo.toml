[package]
name = "synapse-mesh"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Multi-Agent Autonomous LLM Execution Mesh with DAG Scheduling & Memory Vector Fabric"
license = "Apache-2.0"
repository = "https://github.com/ER-brocode/synapse-mesh"
readme = "README.md"
keywords = ["agents", "dag", "vector-store", "concurrency", "distributed"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
petgraph = "0.6"
